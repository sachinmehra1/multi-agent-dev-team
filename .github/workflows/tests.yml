name: Project checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker pull python:3.12-slim
      - run: RUN_DOCKER_TESTS=1 python -m pytest tests/test_integration.py -q
      - run: docker build -f Dockerfile.executor -t coder-python-api:module2 .
      - run: RUN_MODULE2_DOCKER_TESTS=1 python -m pytest tests/test_api_fixture.py -q
      - run: docker build -f Dockerfile.qa -t coder-python-qa:module3 .
      - run: RUN_MODULE3_DOCKER_TESTS=1 python -m pytest tests/test_qa_team.py -q
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build agent
